  <style>
    .mouse-light,.opening-cursor{display:none}.opening{background:radial-gradient(circle 530px at var(--mouse-x,50%) var(--mouse-y,50%),#cbdcc0 0%,#e1e9d8 34%,#edf0e5 73%)}.opening::before,.opening::after{animation:none}.opening h1{background:radial-gradient(circle 460px at var(--mouse-x,50%) var(--mouse-y,50%),#f8fbf2 0%,#6b8b68 47%,#173d2c 80%);background-clip:text;-webkit-background-clip:text;color:transparent}.opening h1 span{color:transparent;font-style:normal}.hero{min-height:46vh;padding:clamp(7rem,10vw,9rem) 12vw 2rem}.memory-column{min-height:258rem;padding-top:0}.flourish-field{z-index:2}.flourish{border-color:rgba(65,104,68,.5);opacity:var(--fade)}.garden-detail{opacity:.7}.reveal-wash{display:none;position:fixed;inset:-25vmax;z-index:50;pointer-events:none;background:radial-gradient(circle at center,#dce8d3 0 12%,#769275 29%,#234d38 60%,#0f3023 100%);transform:scale(0);border-radius:50%}.revealing .reveal-wash{display:block;animation:reveal-wash .85s cubic-bezier(.76,0,.24,1) forwards}.revealing .opening{transform:scale(.92);opacity:.25}.revealing .opening-copy{transform:scale(.82);opacity:0;transition:.32s}.revealed .archive{animation:grand-reveal 1.35s cubic-bezier(.16,1,.3,1) both}@keyframes reveal-wash{0%{transform:scale(0);opacity:1}58%{transform:scale(1);opacity:1}100%{transform:scale(1.5);opacity:0}}@keyframes grand-reveal{0%{opacity:0;clip-path:polygon(0 100%,100% 100%,100% 100%,0 100%);transform:translateY(8vh) scale(.96)}42%{opacity:1;clip-path:polygon(0 20%,100% 0,100% 100%,0 100%)}100%{opacity:1;clip-path:polygon(0 0,100% 0,100% 100%,0 100%);transform:none}}
    @media(max-width:650px){.hero{min-height:40vh;padding:7rem 1.5rem 1rem}.memory-column{min-height:210rem}}
  </style>
  <style>
    /* Last-stage spacing and opening refinements */
    .opening h1{line-height:1.06;padding:.08em 0 .16em;color:#173d2c;background:none;letter-spacing:-.07em}.opening h1 span{color:inherit;font-style:normal}.hero{min-height:49vh;padding:clamp(5rem,6vw,6rem) 12vw 1rem}.hero h2{font-size:clamp(2.3rem,5.2vw,5.8rem);line-height:.94}.memory-column{min-height:235rem;padding-top:0}.memory-column::before{display:none}.photo-note{z-index:5}.birthday-letter{top:62rem;z-index:3}.note-b{top:20rem}.note-c{top:38rem}.note-d{top:94rem}.note-e{top:112rem}.note-f{top:131rem}.note-g{top:150rem}.note-h{top:169rem}.note-i{top:188rem}.reveal-wash{display:none!important}.flourish{border:1.5px solid rgba(66,108,70,.42);box-shadow:0 0 0 3px rgba(173,193,150,.11);opacity:var(--fade)}.explicit-mark{position:absolute;z-index:2;pointer-events:none;color:#5c865d;font:700 var(--mark-size) "DM Mono",monospace;opacity:.52;rotate:var(--mark-rotate)}.explicit-mark.dot{width:var(--mark-size);height:var(--mark-size);border-radius:50%;background:#7f9f78;box-shadow:0 0 0 4px rgba(124,158,116,.18)}.explicit-mark.ring{width:calc(var(--mark-size) * 1.5);height:calc(var(--mark-size) * 1.5);border:1.5px solid #70936f;border-radius:50%}.explicit-mark.cross{font:700 2rem/1 "Playfair Display",serif;color:#668863}.explicit-mark.dash{font-size:2rem;color:#668863}.reveal-wash::after{display:none}
    @media(max-width:650px){.hero{min-height:44vh;padding:4.5rem 1.5rem .5rem}.memory-column{min-height:215rem}.birthday-letter{top:42rem}.note-b{top:13rem}.note-c{top:24rem}.note-d{top:78rem}.note-e{top:93rem}.note-f{top:108rem}.note-g{top:123rem}.note-h{top:138rem}.note-i{top:153rem}}
  </style>
  <style>
    .hero{min-height:49vh;padding:0 12vw;display:grid;align-content:center}.memory-column{min-height:242rem}.birthday-letter{top:68rem}.birthday-letter h3{font-size:clamp(3.5rem,7.5vw,6.5rem);line-height:.78}.note-b{top:23rem}.note-c{top:45rem}.note-d{top:100rem}.note-e{top:122rem}.note-f{top:144rem}.note-g{top:166rem}.note-h{top:188rem}.note-i{top:210rem}
    @media(max-width:650px){.hero{min-height:44vh;padding:0 1.5rem}.memory-column{min-height:198rem}.birthday-letter{top:47rem}.birthday-letter h3{font-size:3.7rem}.note-b{top:15rem}.note-c{top:30rem}.note-d{top:90rem}.note-e{top:108rem}.note-f{top:126rem}.note-g{top:144rem}.note-h{top:162rem}.note-i{top:180rem}}
  </style>
  <style>
    .opening::after{content:"";position:absolute;inset:-20%;z-index:0;pointer-events:none;border:0;border-radius:0;background:radial-gradient(circle at 20% 30%,rgba(132,169,122,.34),transparent 28%),radial-gradient(circle at 78% 70%,rgba(67,117,80,.23),transparent 31%);filter:blur(24px);animation:opening-light 14s ease-in-out infinite alternate}.opening-copy{position:relative;z-index:2}.archive::before{content:"";position:absolute;inset:-18%;z-index:0;pointer-events:none;background:radial-gradient(circle at 12% 25%,rgba(159,186,137,.36),transparent 25%),radial-gradient(circle at 86% 42%,rgba(91,137,91,.2),transparent 28%),radial-gradient(circle at 38% 88%,rgba(203,213,171,.38),transparent 26%);filter:blur(32px);animation:archive-light 19s ease-in-out infinite alternate}.archive > *{position:relative}.archive .flourish-field,.archive .garden-detail,.archive .paper-star,.archive .paper-sun,.archive .scribble{position:absolute}@keyframes opening-light{0%{transform:translate3d(-4%,-2%,0) scale(1)}50%{transform:translate3d(5%,4%,0) scale(1.12)}100%{transform:translate3d(-1%,7%,0) scale(1.04)}}@keyframes archive-light{0%{transform:translate3d(-3%,-2%,0) scale(1)}50%{transform:translate3d(5%,3%,0) scale(1.1)}100%{transform:translate3d(-2%,7%,0) scale(1.04)}}@media(prefers-reduced-motion:reduce){.opening::after,.archive::before{animation:none}}
  </style>
</head>
<body>
  <div class="paper-grain"></div><div class="mouse-light"></div><div class="opening-cursor"></div>
  <section class="opening" id="opening" tabindex="0" aria-label="Open birthday memory book">
    <h1>happy birthday!!!</h1>
  </section>

  <main class="archive" id="archive" aria-hidden="true">

    <section class="hero"><h2>if two exclamation marks<br />weren’t enough, <em>maybe three will be?</em></h2></section>

    <section class="memory-column" aria-label="A scrolling column of photo memories">
      <!-- Captions are easy to customise in script.js -->
      <article class="sticky-note photo-note note-a" data-id="0"><img src="photos/20260218_154633.jpg" alt="Birthday memory" /><p></p><span class="tape"></span></article>
      <article class="sticky-note photo-note note-b" data-id="1"><img src="photos/20260519_050416.jpg" alt="Birthday memory" /><p></p><span class="tape"></span></article>
      <article class="sticky-note photo-note note-c" data-id="2"><img src="photos/DSC01584.JPG" alt="Birthday memory" /><p></p><span class="tape"></span></article>

      <article class="birthday-letter"><h3>happy<br /><em>birthday!!!</em></h3><p>thank you for everything. and i hope you have the best f*cking birthday ever.</p><i>with all my love</i><span class="letter-stamp">♡</span></article>

      <article class="sticky-note photo-note note-d" data-id="3"><img src="photos/IMG-20231130-WA0165.jpg" alt="Birthday memory" /><p></p><span class="tape"></span></article>
      <article class="sticky-note photo-note note-e" data-id="4"><img src="photos/IMG-20240224-WA0076.jpg" alt="Birthday memory" /><p></p><span class="tape"></span></article>
      <article class="sticky-note photo-note note-f" data-id="5"><img src="photos/IMG-20240408-WA0055.jpg" alt="Birthday memory" /><p></p><span class="tape"></span></article>
      <article class="sticky-note photo-note note-g" data-id="6"><img src="photos/IMG-20241130-WA0012.jpg" alt="Birthday memory" /><p></p><span class="tape"></span></article>
      <article class="sticky-note photo-note note-h" data-id="7"><img src="photos/IMG-20250906-WA0049.jpg" alt="Birthday memory" /><p></p><span class="tape"></span></article>
      <article class="sticky-note photo-note note-i" data-id="8"><img src="photos/IMG-20260503-WA0037.jpg" alt="Birthday memory" /><p></p><span class="tape"></span></article>
    </section>
    <div class="flourish-field" id="flourish-field" aria-hidden="true"></div><div class="garden-detail detail-one"><i></i><i></i><i></i></div><div class="garden-detail detail-two"><i></i><i></i></div><div class="garden-detail detail-three"><i></i><i></i><i></i></div><div class="garden-detail detail-four"><i></i><i></i></div><div class="paper-star star-one">*</div><div class="paper-star star-two">*</div><div class="paper-star star-three">*</div><div class="paper-star star-four">*</div><div class="paper-star star-five">*</div><div class="paper-sun sun-one"></div><div class="paper-sun sun-two"></div><div class="scribble scribble-one">~</div><div class="scribble scribble-two">~</div>
  </main>

  <div class="reveal-wash" aria-hidden="true"></div>
  <dialog id="lightbox"><button id="close" aria-label="Close photo">×</button><img id="lightbox-image" alt="Expanded memory" /><p id="lightbox-caption"></p></dialog>
  <script src="script.js"></script>
</body>
</html>
